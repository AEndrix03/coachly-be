version: "3.9"

services:
  coachly-be:
    container_name: coachly-be
    build:
      context: .
      dockerfile: Dockerfile
    image: coachly/coachly-be:latest
    restart: unless-stopped
    ports:
      - "${COACHLY_PORT:-8443}:8443"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75
      TZ: ${TZ:-Europe/Rome}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"