version: "3.9"

services:
  coachly-be:
    container_name: coachly-be

    build:
      context: .
      dockerfile: Dockerfile

    image: coachly/coachly-be:latest
    restart: unless-stopped

    ports:
      - "${COACHLY_PORT:-8443}:8443"

    environment:
      # Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8443

      # JVM (override-safe)
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75
        -Djava.security.egd=file:/dev/./urandom

      TZ: ${TZ:-Europe/Rome}

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:rw,nosuid,size=64m

    # Limiti risorse (Docker standalone)
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"